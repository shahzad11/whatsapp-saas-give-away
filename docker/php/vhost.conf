<VirtualHost *:80>
    DocumentRoot /var/www/app

    <Directory /var/www/app>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # Everything that is not a page. These directories live inside the
    # DocumentRoot for historical reasons, so they are denied explicitly rather
    # than being unreachable by construction. AllowOverride is None above, so
    # this cannot be softened by a stray .htaccess.
    #
    # `partials` matches at any depth (admin/partials/, and any future one),
    # which is the point: a partial is a fragment included by a page that has
    # already run its guard, so reaching one directly skips that guard. #48
    # requires every route under /admin to be admin-only, and this is the only
    # way to say so for files that are not routes at all. The partials
    # themselves also refuse to execute standalone — this is the outer of the
    # two, so a misconfigured vhost is not the single point of failure.
    <DirectoryMatch "^/var/www/app/(config|includes|sql|logs)">
        Require all denied
    </DirectoryMatch>
    <DirectoryMatch "^/var/www/app/.*/partials">
        Require all denied
    </DirectoryMatch>

    # Dotfiles, env files, dumps, docs, lockfiles: never servable.
    <FilesMatch "(^\.|\.(env|sql|md|json|lock|ini|log|bak|dist|example)$)">
        Require all denied
    </FilesMatch>
    <Files "health.php">
        Require all granted
    </Files>

    # Traefik terminates TLS, so HSTS is set there; these are the headers that
    # still make sense at the origin.
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    # microphone=(self) is required by the composer's voice recorder — with the
    # blanket deny, getUserMedia() rejects before the browser ever prompts.
    # Geolocation and camera stay denied: nothing in the app asks for them (the
    # camera attach option uses a file input's capture hint, not getUserMedia).
    Header always set Permissions-Policy "geolocation=(), microphone=(self), camera=()"
    Header unset X-Powered-By

    ErrorDocument 404 /404.php

    # Log to the container's stdout/stderr so `docker logs` is the single place
    # to look.
    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
