<VirtualHost *:80>
    DocumentRoot /var/www/app

    <Directory /var/www/app>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # Everything that is not a page. These directories live inside the
    # DocumentRoot for historical reasons, so they are denied explicitly rather
    # than being unreachable by construction. AllowOverride is None above, so
    # this cannot be softened by a stray .htaccess.
    <DirectoryMatch "^/var/www/app/(config|includes|sql|logs)">
        Require all denied
    </DirectoryMatch>

    # Dotfiles, env files, dumps, docs, lockfiles: never servable.
    <FilesMatch "(^\.|\.(env|sql|md|json|lock|ini|log|bak|dist|example)$)">
        Require all denied
    </FilesMatch>
    <Files "health.php">
        Require all granted
    </Files>

    # Traefik terminates TLS, so HSTS is set there; these are the headers that
    # still make sense at the origin.
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "geolocation=(), microphone=(), camera=()"
    Header unset X-Powered-By

    # Log to the container's stdout/stderr so `docker logs` is the single place
    # to look.
    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
