# Overlay that builds the images from source instead of pulling them.
#
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
#
# Used by CI and for testing a change on a server before it is published.

services:
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    image: ${BACKEND_IMAGE:-whatsapp-saas-backend:local}

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    image: ${FRONTEND_IMAGE:-whatsapp-saas-frontend:local}
